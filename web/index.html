<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileTree</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <strong>FileTree</strong>
          <span id="statusText">Ready</span>
        </div>
      </div>
      <div class="pathbar">
        <input id="pathInput" class="path-input" spellcheck="false" autocomplete="off" placeholder="Path">
        <button id="scanBtn" class="primary">📂 Select Directory</button>
        <button id="cancelBtn" disabled>🛑 Stop Scan</button>
        <button id="refreshBtn">🔄 Refresh</button>
      </div>
      <div class="top-actions">
        <button id="exportCsvBtn">CSV</button>
        <button id="exportJsonBtn">JSON</button>
        <button id="exportHtmlBtn">HTML</button>
      </div>
    </header>

    <nav class="ribbon">
      <div id="rootButtons" class="root-buttons"></div>
      <div class="ribbon-group">
        <span class="group-label">Mode</span>
        <div class="segmented-control" id="metricGroup">
          <button class="segment active" data-value="size">Size</button>
          <button class="segment" data-value="allocated">Allocated</button>
          <button class="segment" data-value="files">Files</button>
          <button class="segment" data-value="folders">Folders</button>
        </div>
      </div>
      <div class="ribbon-group">
        <span class="group-label">Unit</span>
        <div class="segmented-control" id="unitGroup">
          <button class="segment active" data-value="auto">Auto</button>
          <button class="segment" data-value="gb">GB</button>
          <button class="segment" data-value="mb">MB</button>
          <button class="segment" data-value="kb">KB</button>
          <button class="segment" data-value="bytes">Bytes</button>
        </div>
      </div>
      <label>
        Threads
        <input id="threadsInput" class="small-input" type="number" min="1" max="64" value="8">
      </label>
      <label>
        Exclude
        <input id="excludeInput" class="filter-input" spellcheck="false" placeholder="*.tmp;node_modules">
      </label>
      <label class="check">
        <input id="hiddenToggle" type="checkbox" checked>
        Hidden
      </label>
      <label class="check">
        <input id="filesToggle" type="checkbox" checked>
        Files
      </label>
      <label class="check">
        <input id="followToggle" type="checkbox">
        Links
      </label>
      <input id="filterInput" class="search-input" spellcheck="false" placeholder="Filter">
    </nav>

    <main class="workspace">
      <section class="table-pane">
        <div class="table-head">
          <button data-sort="name">Name</button>
          <button data-sort="size">Size</button>
          <button data-sort="allocated">Allocated</button>
          <button data-sort="files">Files</button>
          <button data-sort="folders">Folders</button>
          <button data-sort="percent">% Parent</button>
          <button data-sort="modified">Last Modified</button>
        </div>
        <div id="rows" class="rows"></div>
      </section>

      <aside class="side-pane">
        <section id="summaryPanel" class="summary-panel"></section>
        <section id="selectionPanel" class="selection-panel"></section>
        <div class="tabs">
          <button class="active" data-tab="treemap">Treemap</button>
          <button data-tab="extensions">Extensions</button>
          <button data-tab="top">Top</button>
          <button data-tab="duplicates">Duplicates</button>
          <button data-tab="errors">Errors</button>
        </div>
        <section id="tab-treemap" class="tab-panel active">
          <div id="treemap" class="treemap"></div>
        </section>
        <section id="tab-extensions" class="tab-panel">
          <div id="extensionList" class="bar-list"></div>
          <div id="ageList" class="bar-list age-list"></div>
        </section>
        <section id="tab-top" class="tab-panel">
          <div id="topList" class="item-list"></div>
        </section>
        <section id="tab-duplicates" class="tab-panel">
          <div class="dup-tools">
            <label>
              Min
              <input id="duplicateMinInput" type="number" min="0" value="1048576">
            </label>
            <button id="exactDupBtn">Exact hash scan</button>
          </div>
          <div id="duplicateList" class="item-list"></div>
        </section>
        <section id="tab-errors" class="tab-panel">
          <div id="errorList" class="item-list"></div>
        </section>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="footerStats">No scan loaded</span>
      <span id="rowStats"></span>
    </footer>
  </div>

  <div id="contextMenu" class="context-menu" hidden>
    <button data-action="open">Open / Play</button>
    <button data-action="reveal">Reveal in Explorer</button>
    <button data-action="copy">Copy path</button>
    <div class="menu-separator"></div>
    <button data-action="delete" class="danger">Delete</button>
    <div class="menu-separator"></div>
    <button data-action="properties">Properties</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
