[package]
name = "filetree-desktop"
version = "2.0.0"
description = "FileTree v2 low-memory Windows desktop shell"
authors = ["Danny213123"]
edition = "2024"
publish = false

[lib]
name = "filetree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "FileTree"
path = "src/main.rs"

[features]
# Screenshot build with invented data; see scripts/build-demo.ps1.
demo = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filetree-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
notify = "8.2"
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
